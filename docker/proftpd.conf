# ProFTPD - dual-stack camera upload daemon.
# Runtime ports, MasqueradeAddress, TLS, and limits: conf.d/runtime.conf and tls.conf

Include                         /etc/proftpd/modules.conf
LoadModule                      mod_ifsession.c
LoadModule                      mod_tls.c

ServerName                      "AviationWX Push Webcam FTP"
ServerType                      standalone
DefaultServer                   on
UseIPv6                         on
UseReverseDNS                   off
WtmpLog                         off

User                            proftpd
Group                           nogroup

# Auth via mod_auth_file (sync-push-config.php maintains ftpd.passwd).
AuthOrder                       mod_auth_file.c
AuthUserFile                    /etc/proftpd/ftpd.passwd
RequireValidShell               off
# Per-user homedir from AuthUserFile; DefaultRoot ~ chroots each session to that inbox
# (same containment goal as SFTP chroot). Writable inboxes work inside the jail (Umask 002).
DefaultRoot                     ~
# umask 002: uploads are ftp:www-data 664 so www-data can rewrite EXIF.
Umask                           002

SystemLog                       /var/log/proftpd.log
LogFormat                       default "%h %l %u %t \"%r\" %s %b"
ExtendedLog                     /var/log/proftpd.log WRITE,READ default

<Directory />
  AllowOverwrite                on
</Directory>

# Block /proc exposure inside chrooted sessions (ProFTPD BCP).
<Directory /proc>
  <Limit ALL>
    DenyAll
  </Limit>
</Directory>

Include                         /etc/proftpd/conf.d/*.conf
