# Main Nginx configuration file
# This file defines the log_format in the http context
# Mount this as /etc/nginx/nginx.conf to enable JSON access logging

user nginx;
worker_processes auto;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Trust the real client IP from Cloudflare. Production listens publicly and is fronted by
    # Cloudflare; without real_ip, $remote_addr at the proxy_pass hop is the CF edge, and PHP
    # cannot distinguish it from a direct-origin client that fabricates CF-Connecting-IP.
    # Ranges verified 2026-09-15 from https://api.cloudflare.com/client/v4/ips.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # CORS allowlist for Public API (M2M): *.aviationwx.org and localhost
    # When Origin matches, echo it back; otherwise no Access-Control-Allow-Origin (blocks cross-origin)
    map $http_origin $cors_allow_origin {
        default "";
        "~^https://(aviationwx\.org|([a-z0-9-]+\.)?aviationwx\.org)$" $http_origin;
        "~^http://localhost(:[0-9]+)?$" $http_origin;
        "~^http://127\.0\.0\.1(:[0-9]+)?$" $http_origin;
    }

    # JSON log format for access logs
    log_format json_access escape=json
        '{'
            '"time":"$time_iso8601",'
            '"remote_addr":"$remote_addr",'
            '"request":"$request",'
            '"request_method":"$request_method",'
            '"request_uri":"$request_uri",'
            '"status":$status,'
            '"body_bytes_sent":$body_bytes_sent,'
            '"http_referer":"$http_referer",'
            '"http_user_agent":"$http_user_agent",'
            '"http_x_forwarded_for":"$http_x_forwarded_for",'
            '"request_time":$request_time,'
            '"upstream_response_time":"$upstream_response_time",'
            '"source":"nginx_access"'
        '}';

    # Note: The "combined" log_format is already defined by nginx by default,
    # so we don't need to redefine it here. It's available as a fallback.

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Proxy cache for map tiles (reduces OpenWeatherMap API usage)
    proxy_cache_path /var/cache/nginx/map_tiles
                     levels=1:2
                     keys_zone=map_tiles:10m
                     max_size=500m
                     inactive=7d
                     use_temp_path=off;

    # Cache headers for /public JS/CSS (locations in conf.d/default.conf).
    # Versioned URLs (?v=<build hash>) change on every deploy, so browsers
    # and the CDN can cache them long-term. Unversioned URLs keep the
    # conservative short-lived behavior (JS: no-store for aggressive refresh
    # on mobile Safari, CSS: 15 minutes). Empty map values omit the header.
    map $arg_v $public_js_cache_control {
        ""      "no-cache, no-store, must-revalidate";
        default "public, max-age=2592000, immutable";
    }
    map $arg_v $public_js_pragma {
        ""      "no-cache";
        default "";
    }
    map $arg_v $public_js_expires {
        ""      "0";
        default "";
    }
    map $arg_v $public_css_cache_control {
        ""      "public, max-age=900, must-revalidate";
        default "public, max-age=2592000, immutable";
    }

    # Include server configurations
    include /etc/nginx/conf.d/*.conf;
}

